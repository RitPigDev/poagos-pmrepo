name: Publish Pacman Repo

on:
  push:
    branches: [main]
  workflow_dispatch:  # lets you trigger it manually from GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: pacman -Syu --noconfirm base-devel

      - name: Build repo database
        run: |
          mkdir -p repo
          # If you have packages, copy them here later
          # cp packages/*.pkg.tar.zst repo/ 2>/dev/null || true
          cd repo
          repo-add poagos-pmrepo.db.tar.gz || true

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd repo
          gh release delete latest --yes 2>/dev/null || true
          gh release create latest \
            poagos-pmrepo.db.tar.gz \
            poagos-pmrepo.files.tar.gz \
            --title "Latest" \
            --notes "Auto-published"
