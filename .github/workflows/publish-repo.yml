name: Publish Pacman Repo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: pacman -Syu --noconfirm base-devel github-cli git

      - name: Build repo database
        run: |
          mkdir -p repo
          cd repo
          repo-add poagos-pmrepo.db.tar.gz || true

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes 2>/dev/null || true
          gh release create latest \
            repo/poagos-pmrepo.db.tar.gz \
            repo/poagos-pmrepo.files.tar.gz \
            --title "Latest" \
            --notes "Auto-published"
